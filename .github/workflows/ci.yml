# Checks every pull request (and every push to main): the code must typecheck and pass lint
# before it can be merged.
name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Typecheck the app
        run: npx tsc --noEmit -p .
      - name: Typecheck the cloud worker
        run: npm run cloud:check
      - name: Lint
        run: npm run lint
